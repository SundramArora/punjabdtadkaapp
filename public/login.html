<div class="container" ng-controller="mainController as login">
    <form ng-if="!login.isLoggedIn" ng-submit="login.login()">
        <label>Username: <input type="text" name="username" ng-model="login.loginData.username" required></label>
        <label>Password: <input type="password" name="password" ng-model="login.loginData.password" required></label>
        <button type="submit" class="btn btn-success">Sign in</button>
        <p role="alert" ng-if="login.error">{{login.error}}</p>
    </form>
    <div ng-if="login.isLoggedIn">
        <p>Signed in as {{login.user.name || login.user.username}}.</p>
        <button type="button" class="btn btn-default" ng-click="login.logout()">Sign out</button>
    </div>
</div>
